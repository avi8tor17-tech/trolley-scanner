<style>
:root{--g:#16803c;--g2:#0f5f2c;--bg:#f4f6f5;--card:#fff;--tx:#17201b;--mut:#66726b;--bd:#dfe5e1;--red:#c62828;--amb:#b26a00;
--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(var(--st) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.storeBtn{background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:10px 14px;font-weight:600;min-height:44px;display:flex;align-items:center;gap:6px;max-width:62vw}
.storeBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:flex;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:calc(var(--st) + 64px);z-index:4}
nav button{flex:1;padding:12px 4px;min-height:48px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--g);border-bottom-color:var(--g)}
main{padding:12px 12px calc(170px + var(--sb))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.empty{text-align:center;color:var(--mut);padding:40px 16px}
.empty b{display:block;font-size:20px;color:var(--tx);margin-bottom:6px}
.item{display:flex;gap:10px;align-items:center}
.item img,.item .ph{width:52px;height:52px;border-radius:10px;object-fit:contain;background:#eef2ef;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}
.item .info{flex:1;min-width:0}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .sub{color:var(--mut);font-size:14px}
.item .unit{color:var(--g);font-weight:600;text-decoration:underline dotted;padding:4px 0}
.row2{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty{display:flex;align-items:center;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.qty button{width:48px;height:44px;font-size:24px;font-weight:700;color:var(--g)}
.qty span{min-width:34px;text-align:center;font-weight:700}
.line{margin-left:auto;font-weight:700;font-size:18px}
.rm{width:44px;height:44px;border-radius:12px;color:var(--red);font-size:20px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--bd);padding:10px 12px calc(10px + var(--sb));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.tot{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.tot .lbl{color:var(--mut);font-size:14px}
.tot .amt{font-size:32px;font-weight:800;letter-spacing:-.5px}
.tot.over .amt{color:var(--red)}
.budgetMsg{font-size:14px;font-weight:600;margin:-4px 0 8px}
.budgetMsg.ok{color:var(--g)}.budgetMsg.warn{color:var(--amb)}.budgetMsg.over{color:var(--red)}
.btns{display:flex;gap:8px}
.big{flex:1;min-height:56px;border-radius:14px;font-size:17px;font-weight:700;background:var(--g);color:#fff}
.big.sec{flex:.55;background:#e8f2ec;color:var(--g2)}
.btn{min-height:48px;border-radius:12px;padding:10px 16px;font-weight:600;background:#e8f2ec;color:var(--g2)}
.btn.pri{background:var(--g);color:#fff}.btn.dang{background:#fdecec;color:var(--red)}
.btn.full{width:100%}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools .btn{flex:1}
label.f{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input.t,select.t{width:100%;min-height:50px;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:18px;background:#fff}
input.price{font-size:30px;font-weight:700;text-align:center}
.sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + var(--sb));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:20px}
.sheet .acts{display:flex;gap:8px;margin-top:16px}
.sheet .acts .btn{flex:1;min-height:54px;font-size:17px}
.prod{display:flex;gap:12px;align-items:center;margin:6px 0}
.prod img{width:72px;height:72px;object-fit:contain;border-radius:10px;background:#eef2ef}
.muted{color:var(--mut);font-size:14px}
.storeList button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:14px 12px;min-height:54px;border-bottom:1px solid var(--bd);font-size:18px;text-align:left}
.storeList button.on{color:var(--g);font-weight:700}
.storeList .cnt{font-size:13px;color:var(--mut);font-weight:400}
#scanner{position:fixed;inset:0;z-index:15;background:#000;display:flex;flex-direction:column}
#scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reticle{position:absolute;left:8%;right:8%;top:30%;height:22%;border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
.reticle::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#ff3b30;box-shadow:0 0 8px #ff3b30}
.reticle.hit{border-color:#3ddc84}
.scTop{position:relative;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--st) + 10px) 12px 10px;gap:8px}
.scTop .pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:10px 16px;font-weight:600;min-height:46px}
.scMsg{position:absolute;left:0;right:0;top:calc(30% - 52px);text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 3px #000;padding:0 16px}
.scBot{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(14px + var(--sb));background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
.scBot .tot2{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-weight:700}
.scBot .tot2 b{font-size:28px}
.scBot .btns .big.sec{background:rgba(255,255,255,.2);color:#fff}
.last{background:rgba(255,255,255,.95);color:var(--tx);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(180px + var(--sb));background:#17201b;color:#fff;padding:12px 18px;border-radius:12px;z-index:40;font-weight:600;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pb .item{padding:4px 0}
.pb .card{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{background:#e8f2ec;color:var(--g2);border-radius:999px;padding:8px 12px;font-size:15px;font-weight:600}
small.note{display:block;color:var(--mut);margin-top:8px;font-size:13px}
.snapThumb{display:block;max-width:100%;max-height:160px;border-radius:10px;margin-top:8px}
.flash{animation:fl 1.2s}@keyframes fl{0%{background:#c9f0d6}100%{background:#fff}}
.big.sec#snapBtn{flex:.5}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #cfe3d6;border-top-color:var(--g);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.onlineLinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.onlineLinks a{display:inline-flex;align-items:center;background:#e8f2ec;color:var(--g2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;text-decoration:none;min-height:36px}
.toggleRow{display:flex;align-items:flex-start;gap:12px;margin-top:8px;min-height:44px}
.toggleRow input{width:24px;height:24px;flex:none;margin-top:2px}
</style>

<body>
<header>
  <h1>🛒 Trolley</h1>
  <button class="storeBtn" id="storeBtn" aria-label="Choose store">📍 <span id="storeName">Choose store</span> ▾</button>
</header>
<nav>
  <button data-tab="trolley" class="on">Trolley</button>
  <button data-tab="prices">Price book</button>
  <button data-tab="settings">More</button>
</nav>
<main>
  <section id="tab-trolley"></section>
  <section id="tab-prices" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
</main>
<div class="bar" id="bar">
  <div class="tot" id="totRow"><div><div class="lbl" id="countLbl">0 items</div><div class="lbl">Total (GST incl.)</div></div><div class="amt" id="totAmt">$0.00</div></div>
  <div class="budgetMsg hidden" id="budgetMsg"></div>
  <div class="btns">
    <button class="big" id="scanBtn">📷 Scan</button>
    <button class="big sec" id="snapBtn" aria-label="Snap price tag">📸 Tag</button>
    <button class="big sec" id="manualBtn">＋ Add</button>
  </div>
</div>

<div id="scanner" class="hidden">
  <video id="video" playsinline muted autoplay></video>
  <div class="reticle" id="reticle"></div>
  <div class="scMsg" id="scMsg">Line up the barcode in the box</div>
  <div class="scTop">
    <button class="pill" id="scClose">✕ Done</button>
    <button class="pill hidden" id="torchBtn">🔦 Light</button>
    <button class="pill" id="scType">⌨︎ Type code</button>
  </div>
  <div class="scBot">
    <div class="last hidden" id="lastAdded"></div>
    <div class="tot2"><span id="scCount">0 items</span><b id="scTot">$0.00</b></div>
    <div class="btns">
      <button class="big sec" id="scNoCode">No barcode</button>
      <button class="big" id="scDone">View trolley</button>
    </div>
  </div>
</div>

<div id="sheets"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
"use strict";
/* ================= Core logic (pure, testable) ================= */
const Core = (() => {
  const KEY = 'trolleyScanner.v1';
  const DEFAULT_STORES = ['Costco','Coles','Woolworths','Aldi','IGA','Kmart','Big W','Bunnings','Chemist Warehouse']
    .map(n => ({ id: slug(n), name: n, builtin: true }));
  function slug(s){ return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'store'; }
  function blank(){ return { version:1, customStores:[], lastStore:null, priceBook:{}, trolleys:{}, budgets:{}, products:{}, showOnlinePriceLinks:false }; }

  // ---- money (stored as integer cents) ----
  function parsePrice(v){
    if (typeof v === 'number') return isFinite(v) && v >= 0 ? Math.round(v*100) : null;
    let s = String(v||'').trim().replace(/[$\sA-Za-z]/g,'');
    if (/^\d+,\d{1,2}$/.test(s)) s = s.replace(',','.');
    s = s.replace(/,/g,'');
    if (!/^\d*\.?\d*$/.test(s) || s === '' || s === '.') return null;
    const n = parseFloat(s);
    return isFinite(n) && n >= 0 ? Math.round(n*100) : null;
  }
  function fmt(c){
    const neg = c < 0; c = Math.abs(Math.round(c||0));
    const d = Math.floor(c/100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg?'-':'') + '$' + d + '.' + String(c%100).padStart(2,'0');
  }

  // ---- barcodes ----
  function checksumOk(code){
    if (!/^\d+$/.test(code) || ![8,12,13,14].includes(code.length)) return false;
    const digits = code.split('').map(Number); const check = digits.pop();
    let sum = 0; digits.reverse().forEach((d,i) => { sum += d * (i % 2 === 0 ? 3 : 1); });
    return (10 - (sum % 10)) % 10 === check;
  }
  function expandUPCE(e){ // 8-digit UPC-E -> 12-digit UPC-A
    if (!/^[01]\d{7}$/.test(e)) return null;
    const ns = e[0], d = e.slice(1,7), ck = e[7]; let m;
    const last = d[5];
    if ('012'.includes(last)) m = d.slice(0,2) + last + '0000' + d.slice(2,5);
    else if (last === '3') m = d.slice(0,3) + '00000' + d.slice(3,5);
    else if (last === '4') m = d.slice(0,4) + '00000' + d[4];
    else m = d.slice(0,5) + '0000' + last;
    return ns + m + ck;
  }
  // Normalise to a canonical key: UPC-A(12) -> EAN-13 with leading 0; UPC-E -> EAN-13.
  function normalize(raw, format){
    let c = String(raw||'').replace(/\D/g,'');
    if (!c) return null;
    if (format === 'upc_e' || (c.length === 8 && format !== 'ean_8' && !checksumOk(c) && expandUPCE(c))) {
      const a = expandUPCE(c); if (a) c = a;
    } else if (c.length === 6 || c.length === 7) {
      const a = expandUPCE(c.length === 6 ? '0' + c + upceCheck('0'+c) : c + upceCheck(c));
      if (a) c = a;
    }
    if (c.length === 12) c = '0' + c;
    if (c.length === 14 && c[0] === '0') c = c.slice(1);
    return c;
  }
  function upceCheck(seven){ const a = expandUPCE(seven + '0'); if(!a) return '0';
    const body = a.slice(0,11).split('').map(Number); let s=0; body.forEach((d,i)=>{ s += d*(i%2===0?3:1); }); return String((10-(s%10))%10); }
  function isValidScan(code){ return checksumOk(code); }

  // ---- state ----
  function load(storage){
    try { const s = JSON.parse(storage.getItem(KEY)); if (s && s.version === 1) return Object.assign(blank(), s); } catch(e){}
    return blank();
  }
  function save(storage, state){ storage.setItem(KEY, JSON.stringify(state)); }
  function stores(state){ return DEFAULT_STORES.concat(state.customStores); }
  function storeById(state, id){ return stores(state).find(s => s.id === id) || null; }
  function addStore(state, name){
    name = String(name||'').trim(); if (!name) return null;
    const existing = stores(state).find(s => s.name.toLowerCase() === name.toLowerCase());
    if (existing) return existing;
    let id = slug(name), n = 2; while (storeById(state, id)) id = slug(name) + '-' + (n++);
    const st = { id, name, builtin:false }; state.customStores.push(st); return st;
  }
  function removeStore(state, id){
    state.customStores = state.customStores.filter(s => s.id !== id);
    delete state.priceBook[id]; delete state.trolleys[id]; delete state.budgets[id];
    if (state.lastStore === id) state.lastStore = null;
  }
  function book(state, storeId){ return state.priceBook[storeId] || (state.priceBook[storeId] = {}); }
  function trolley(state, storeId){ return state.trolleys[storeId] || (state.trolleys[storeId] = []); }
  function today(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function noBarcodeKey(name){ return 'nb:' + String(name).toLowerCase().trim().replace(/\s+/g,' '); }

  function getPrice(state, storeId, key){ return (state.priceBook[storeId]||{})[key] || null; }
  function setPrice(state, storeId, key, name, cents, image){
    const b = book(state, storeId);
    b[key] = { name: name || (b[key] && b[key].name) || key, price: cents, updated: today(), image: image || (b[key] && b[key].image) || null };
    return b[key];
  }
  function deletePrice(state, storeId, key){ const b = book(state, storeId); delete b[key]; }

  function addToTrolley(state, storeId, {key, barcode=null, name, price, image=null, qty=1}){
    const t = trolley(state, storeId);
    const ex = t.find(i => i.key === key);

/* ================= Product lookup ================= */
const Lookup = (() => {
  const SOURCES = [
    'https://world.openfoodfacts.org/api/v2/product/',
    'https://world.openproductsfacts.org/api/v2/product/',
    'https://world.openbeautyfacts.org/api/v2/product/'
  ];
  const FIELDS = '?fields=product_name,product_name_en,generic_name,brands,quantity,image_front_small_url,image_small_url,image_url';
  async function one(base, code){
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 7000);
    try {
      const r = await fetch(base + encodeURIComponent(code) + '.json' + FIELDS, { signal: ctl.signal });
      if (!r.ok) return null;
      const j = await r.json(); if (j.status !== 1 || !j.product) return null;
      const p = j.product; const nm = (p.product_name_en || p.product_name || p.generic_name || '').trim();
      if (!nm) return null;
      const brand = (p.brands || '').split(',')[0].trim();
      let name = nm;
      if (brand && !nm.toLowerCase().includes(brand.toLowerCase())) name = brand + ' ' + nm;
      const qty = String(p.quantity || '').replace(/\s*[e℮]\s*$/i, '').trim();
      if (qty && !name.toLowerCase().includes(qty.toLowerCase())) name += ' ' + qty;
      return { name, image: p.image_front_small_url || p.image_small_url || p.image_url || null };
    } catch(e) { return null; } finally { clearTimeout(tm); }
  }
  async function find(code){
    const tries = [code]; if (code.length === 13 && code[0] === '0') tries.push(code.slice(1));
    for (const base of SOURCES) for (const c of tries) { const r = await one(base, c); if (r) return r; }
    return null;
  }
  return { find };
})();

      say('<span class="spin"></span> Reading price tag… step ' + (i+1) + ' of ' + passes.length);
      await w.setParameters({ tessedit_pageseg_mode: psm });
      const d = (await w.recognize(img.canvas)).data;
      ocrToLines(d, big.scale / img.scale, lines); texts.push(d.text);
    }
    const r = Core.parsePriceTag({ lines });
    const thumb = big.thumb, data = { text: texts.join('\n---\n') };
    r.thumb = thumb; r.text = data.text; window.TrolleyApp.lastOcr = r;
    say(r.price != null ? '📸 Found <b>' + Core.fmt(r.price) + '</b>. Check it matches the tag before adding.' : '📸 Couldn\'t read a price from that photo. Type it in, or try again closer and straight-on.');
    return r;
  } catch(e) {
    if (statusEl) statusEl.innerHTML = '📸 Price tag reader unavailable (' + esc(e.message || e) + '). Type the price instead.';
    return null;
  } finally { if (hadCam) resumeCamera(); }
}
function wireSnap(el, priceSel, nameSel){
  const btn = el.querySelector('[data-a=snap]'), st = el.querySelector('.snapStatus'), alts = el.querySelector('.snapAlts');
  if (!btn) return;
  btn.onclick = async () => {

    if (r.price != null) { pi.value = (r.price/100).toFixed(2); pi.classList.add('flash'); setTimeout(() => pi.classList.remove('flash'), 1200); }

/* ---- handling a scanned code ---- */
let busy = false;
async function handleCode(raw, format){
  const storeId = await ensureStore(); if (!storeId) return;
  const code = Core.normalize(raw, format);
  if (!code) return;
  busy = true;
  try {
    const known = Core.getPrice(S, storeId, code);
    if (known) {
      const it = Core.addToTrolley(S, storeId, { key: code, barcode: code, name: known.name, price: known.price, image: known.image });
      persist(); render(); showLast(it, true);
      return;
    }
    let info = S.products[code];
    if (!info) {
      setScanMsg('<span class="spin"></span> Looking up ' + code + '…');
      const lu = await Lookup.find(code);
      if (lu) { info = lu; S.products[code] = lu; persist(); }
    }
    setScanMsg('Line up the barcode in the box');
    // known at another store? offer its name
    if (!info) { for (const sid in S.priceBook) { const e = S.priceBook[sid][code]; if (e) { info = { name: e.name, image: e.image }; break; } } }
    const r = await priceSheet({ title: 'New item', name: info ? info.name : '', image: info && info.image, barcode: code, askName: true, qtyField: true });
    if (!r) return;
    S.products[code] = { name: r.name, image: info && info.image || null };
    Core.setPrice(S, storeId, code, r.name, r.price, info && info.image);
    const it = Core.addToTrolley(S, storeId, { key: code, barcode: code, name: r.name, price: r.price, image: info && info.image, qty: r.qty });
    persist(); render(); showLast(it, false);
  } finally { busy = false; }
}

/* ================= Scanner ================= */
let stream = null, detector = null, scanning = false, paused = false, lastCode = '', lastTime = 0, candidate = '', candCount = 0, loopTimer = null;
const FORMATS = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'];
function setScanMsg(h){ $('#scMsg').innerHTML = h; }
async function getDetector(){
  if (detector) return detector;
  let BD = window.BarcodeDetector, fmts = FORMATS;
  try { if (BD) { const sup = await BD.getSupportedFormats(); fmts = FORMATS.filter(f => sup.includes(f)); if (!fmts.includes('ean_13')) BD = null; } } catch(e){ BD = null; }
  if (!BD) {
    setScanMsg('<span class="spin"></span> Loading scanner…');
    let mod = null;
    for (const u of ['https://cdn.jsdelivr.net/npm/barcode-detector@3.2.4/dist/es/ponyfill.js', 'https://unpkg.com/barcode-detector@3.2.4/dist/es/ponyfill.js']) {
      try { mod = await import(u); break; } catch(e){}
    }
    if (!mod) throw new Error('scanner library failed to load');
    // load the decoder (WebAssembly), trying a couple of CDNs
    let ready = false;
    for (const cdn of ['https://cdn.jsdelivr.net/npm', 'https://unpkg.com', 'https://fastly.jsdelivr.net/npm']) {
      try {
        mod.purgeZXingModule();
        await mod.prepareZXingModule({ fireImmediately: true, overrides: { locateFile: (p, pre) => { const m = p.match(/_(.+?)\.wasm$/); return m ? cdn + '/zxing-wasm@' + mod.ZXING_WASM_VERSION + '/dist/' + m[1] + '/' + p : pre + p; } } });
        ready = true; break;
      } catch(e){}
    }
    if (!ready) throw new Error('decoder failed to load');
    BD = mod.BarcodeDetector; fmts = FORMATS;
  }
  detector = new BD({ formats: fmts });
  return detector;
}
async function openScanner(){
  unlockAudio();
  const storeId = await ensureStore(); if (!storeId) return;
  $('#scanner').classList.remove('hidden'); $('#lastAdded').classList.add('hidden');
  render();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setScanMsg('Camera not available here (needs HTTPS). Use “Type code”.'); return; }
  setScanMsg('<span class="spin"></span> Starting camera…');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch(e) {
    setScanMsg(e && e.name === 'NotAllowedError' ? 'Camera permission was blocked. Allow camera for this site in your browser settings, or tap “Type code”.' : 'Couldn\'t start the camera (' + esc(e && e.message || e) + '). Tap “Type code”.');
    return;
  }
  const v = $('#video'); v.srcObject = stream; try { await v.play(); } catch(e){}
  try { const tr = stream.getVideoTracks()[0]; const caps = tr.getCapabilities ? tr.getCapabilities() : {};
    if (caps.torch) $('#torchBtn').classList.remove('hidden');
    if (caps.focusMode && caps.focusMode.includes('continuous')) tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
  } catch(e){}
  try { await getDetector(); } catch(e) { setScanMsg('Scanner failed to load (no internet?). Tap “Type code”.'); return; }
  setScanMsg('Line up the barcode in the box');
  scanning = true; paused = false; loop();
}
async function loop(){
  if (!scanning) return;
  const v = $('#video');
  if (!paused && !busy && v.readyState >= 2 && !document.querySelector('.sheetBg')) {
    try {
      const res = await detector.detect(v);
      const hit = res.find(r => /^\d+$/.test(r.rawValue) && (Core.isValidScan(r.rawValue) || r.format === 'upc_e')) || null;
      if (hit) {
        const code = hit.rawValue;
        // require two consecutive matching reads to avoid misreads
        if (code === candidate) candCount++; else { candidate = code; candCount = 1; }
        const now = Date.now();
        if (candCount >= 2 && !(code === lastCode && now - lastTime < 2500)) {
          lastCode = code; lastTime = now; candidate = ''; candCount = 0;
          beep(true); $('#reticle').classList.add('hit'); setTimeout(() => $('#reticle').classList.remove('hit'), 400);
          await handleCode(code, hit.format);
          lastTime = Date.now();
        }
      }
    } catch(e){ if (!loop.warned) { loop.warned = true; setScanMsg('Scanner error: ' + esc(e.message || e) + '. Tap “Type code”.'); } }
  }
  loopTimer = setTimeout(loop, 120);
}
function pauseScan(p){ paused = p; }
function suspendCamera(){ if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
async function resumeCamera(){
  if ($('#scanner').classList.contains('hidden') || stream) return;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    const v = $('#video'); v.srcObject = stream; await v.play().catch(()=>{}); } catch(e) { setScanMsg('Camera stopped. Tap Done and Scan again.'); }
}
function closeScanner(){
  scanning = false; clearTimeout(loopTimer);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('#video').srcObject = null; $('#torchBtn').classList.add('hidden');
  $('#scanner').classList.add('hidden'); tab = 'trolley'; render();
}
let lastTimer = null;
function showLast(it, auto){
  const msg = (auto ? '✓ ' : '＋ ') + it.name + ' · ' + Core.fmt(it.price) + (it.qty > 1 ? ' (×' + it.qty + ')' : '');
  if ($('#scanner').classList.contains('hidden')) { toast(msg); return; }
  const el = $('#lastAdded'); el.innerHTML = '<span>' + esc(msg) + '</span><button class="unit" style="color:var(--g)" id="lastEdit">Edit</button>';
  el.classList.remove('hidden'); $('#lastEdit').onclick = () => editTrolleyPrice(it.id);
  clearTimeout(lastTimer); lastTimer = setTimeout(() => el.classList.add('hidden'), 6000);
}
let torchOn = false;
$('#torchBtn').onclick = async () => { try { torchOn = !torchOn; await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: torchOn }] }); } catch(e){ toast('Light not supported'); } };
$('#scanBtn').onclick = openScanner;
$('#manualBtn').onclick = () => manualItem();
$('#snapBtn').onclick = () => manualItem({ snap: true });
$('#scClose').onclick = closeScanner; $('#scDone').onclick = closeScanner;
$('#scType').onclick = typeCode;
$('#scNoCode').onclick = () => { pauseScan(true); manualItem().then(() => { const w = setInterval(() => { if (!document.querySelector('.sheetBg')) { clearInterval(w); pauseScan(false); } }, 300); }); };
$('#storeBtn').onclick = () => storePicker();
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0,0); });
document.addEventListener('visibilitychange', () => { if (document.hidden && scanning) closeScanner(); });

/* ---- manifest for "Add to Home screen" ---- */
try {
  const icon = document.querySelector('link[rel=apple-touch-icon]').href;
  const base = location.href.split('#')[0].split('?')[0];
  const m = { name: 'Trolley Scanner', short_name: 'Trolley', start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone',
    background_color: '#f4f6f5', theme_color: '#16803c', icons: [{ src: icon, sizes: '180x180', type: 'image/png' }] };
  $('#manifestLink').href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
} catch(e){}

window.TrolleyApp = { Core, Lookup, get state(){ return S; }, handleCode, render };
render();
if (!cur()) storePicker(true);
</script>
</body>
